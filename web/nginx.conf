# Reverse-proxies /api and /up to the api container; serves the Vue SPA
# bundle for everything else with the standard SPA fallback.

upstream api_backend {
  # `api` resolves via the docker-compose network. Port 80 is what Thruster
  # exposes inside the api container.
  server api:80;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Sensible security headers (defense in depth)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Long-cache the digest-stamped assets
  location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API + healthcheck reverse proxy
  location /api/ {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
  }

  location = /up {
    proxy_pass http://api_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # SPA fallback — every unmatched route falls through to index.html so the
  # client-side router (when added) can handle it.
  location / {
    try_files $uri $uri/ /index.html;
    # Don't cache the shell so deploys take effect immediately
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Hide nginx version
  server_tokens off;
}
